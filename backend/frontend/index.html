<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f0f2f8">
<meta name="description" content="Замын хөдөлгөөний дүрмийн шалгалтад бэлдэх хамгийн хялбар арга. 800+ асуулт, 36 бүлэг, дэлгэрэнгүй статистик.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="ЗХД Шалгалт — Жолооны шалгалтад бэлд">

<title>ЗХД Шалгалт — Жолооны шалгалтад бэлд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/frontend/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  .app-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
  .app-loading .logo-pulse{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;animation:pulse 1.5s infinite}
  .app-loading .logo-pulse svg{color:#fff;width:40px;height:40px}
  .app-loading p{color:#94a3b8;font-size:.85rem;font-weight:500}
</style>
</head>
<body>

<!-- Header -->
<header id="app-header" style="display:none">
<div class="container inner">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    ЗХД Шалгалт
  </div>
  <div class="header-right" id="header-right">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Горим солих">☀️</button>
  </div>
</div>
</header>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Main content -->
<main>
<div class="container" id="app">
  <div class="app-loading">
    <div class="logo-pulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </div>
    <p>Ачаалж байна...</p>
  </div>
</div>
</main>

<!-- Bottom nav -->
<nav class="bottom-nav" id="bottom-nav">
<div class="inner">
  <button class="nav-btn" data-page="home" onclick="nav('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Нүүр
  </button>
  <button class="nav-btn" data-page="exam" onclick="nav('exam')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    Шалгалт

    Статистик
  </button>
  <button class="nav-btn" data-page="profile" onclick="nav('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Профайл

</div>
</nav>

<script src="/frontend/app.js"></script>

</html>
