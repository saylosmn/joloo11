<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e9">
<meta name="description" content="Замын хөдөлгөөний дүрмийн шалгалтад бэлдэх хамгийн хялбар арга. 800+ асуулт, 36 бүлэг, дэлгэрэнгүй статистик.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="ЗХД Шалгалт — Жолооны шалгалтад бэлд">
<meta property="og:description" content="Монголын #1 жолооны шалгалтын апп. 800+ асуулт, жинхэнэ шалгалтын горим.">
<meta property="og:type" content="website">
<title>ЗХД Шалгалт — Жолооны шалгалтад бэлд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/frontend/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  .app-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:18px}
  .app-loading .logo-pulse{width:68px;height:68px;border-radius:20px;background:linear-gradient(180deg,#26282f,#16171b);display:flex;align-items:center;justify-content:center;animation:pulse 1.5s infinite}
  .app-loading .logo-pulse svg{color:#fff;width:34px;height:34px}
  .app-loading p{color:#8d8f97;font-size:.8rem;font-weight:500;letter-spacing:.02em}
</style>
</head>
<body>

<!-- Backdrop: one soft aura plus a fine grain, nothing that moves. -->
<div class="page-aura"></div>
<div class="page-grain"></div>

<!-- Header -->
<header id="app-header" style="display:none">
<div class="container inner">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    ЗХД Шалгалт
  </div>
  <div class="header-right" id="header-right">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Горим солих">☀️</button>
  </div>
</div>
</header>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Main content -->
<main>
<div class="container" id="app">
  <div class="app-loading">
    <div class="logo-pulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </div>
    <p>Ачаалж байна...</p>
  </div>
</div>
</main>

<!-- Bottom nav -->
<nav class="bottom-nav" id="bottom-nav">
<div class="inner">
  <button class="nav-btn" data-page="home" onclick="nav('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Нүүр
  </button>
  <button class="nav-btn" data-page="exam" onclick="nav('exam')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    Шалгалт
  </button>
  <button class="nav-btn" data-page="stats" onclick="nav('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Статистик
  </button>
  <button class="nav-btn" data-page="profile" onclick="nav('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Профайл
  </button>
</div>
</nav>

<script src="/frontend/app.js"></script>
</body>
</html>
